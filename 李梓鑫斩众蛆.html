
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0,user-scalable=no">
<title>众蛆追李梓鑫</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#1a1a1a;display:flex;flex-direction:column;align-items:center;padding:16px;color:#fff}
#gameBox{position:relative;width:340px;height:340px;background:#222;border:3px solid #555;overflow:hidden}
.player{position:absolute;width:28px;height:28px;background:#42a5f5;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;color:white}
.ghost{position:absolute;width:32px;height:32px;background:#8b0000;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;color:#fff;transition:opacity 0.15s}
.killFlash{animation:flash 0.2s}
@keyframes flash{
  0%{background:#fff;transform:scale(1.3)}
  100%{background:#8b0000;transform:scale(1)}
}
.star{position:absolute;width:20px;height:20px;background:#ffd700;clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.weapon{position:absolute;width:24px;height:24px;background:#9c27b0;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:10px}
.info{margin-bottom:8px;font-size:18px}
.tip{margin-top:10px;font-size:14px;color:#aaa;text-align:center}
#overPanel{
    position:absolute;inset:0;background:rgba(0,0,0,0.85);
    display:none;flex-direction:column;align-items:center;justify-content:center;gap:20px;
    color:#fff;text-align:center
}
#restartBtn{padding:10px 22px;font-size:17px;border:none;border-radius:8px;background:#2196F3;color:white}
</style>
</head>
<body>
<div class="info">分数：<span id="score">0</span></div>
<div id="gameBox">
  <div class="player" id="player">鑫</div>
  <div id="ghostWrap"></div>
  <div class="star" id="star"></div>
  <div class="weapon" id="weapon" style="display:none">⚔</div>
  <div id="overPanel">
    <div style="font-size:22px">被众蛆抓住了！</div>
    <div>得分：<span id="finalScore">0</span></div>
    <button id="restartBtn">重新开始</button>
  </div>
</div>
<div class="tip">方框内滑动移动李梓鑫，捡紫色武器后碰蛆击杀！击杀+15分，捡星星+10分；新蛆越来越快！</div>

<script>
const gameBox = document.getElementById("gameBox");
const player = document.getElementById("player");
const ghostWrap = document.getElementById("ghostWrap");
const star = document.getElementById("star");
const weaponDom = document.getElementById("weapon");
const scoreDom = document.getElementById("score");
const finalScoreDom = document.getElementById("finalScore");
const overPanel = document.getElementById("overPanel");
const restartBtn = document.getElementById("restartBtn");

const size = 340;
let score = 0;
let gameOver = false;
let hasWeapon = false;
let px = 150, py = 150;
let weaponX = 0, weaponY = 0;
let ghosts = [];
let sx = 220, sy = 220;
let ghostCount = 0; // 记录蛆的序号，用来提速

let weaponTimer = null;
let ghostTimer = null;
let chaseTimer = null;

function render(){
  player.style.left = px+"px";
  player.style.top = py+"px";
  star.style.left = sx+"px";
  star.style.top = sy+"px";
  weaponDom.style.left = weaponX+"px";
  weaponDom.style.top = weaponY+"px";
}

function addGhost(){
  if(gameOver) return;
  ghostCount++;
  // 第一只速度1.4，之后每多一只+0.2速度
  const spd = 1.4 + (ghostCount - 1)*0.2;
  const g = document.createElement("div");
  g.className = "ghost";
  g.innerText = "蛆";
  ghostWrap.appendChild(g);
  ghosts.push({
    el:g,
    x: Math.random()*300,
    y: Math.random()*300,
    speed: spd
  })
}

function newStar(){
  sx = Math.random()*(size-20);
  sy = Math.random()*(size-20);
}

let startX=0,startY=0;
gameBox.addEventListener("touchstart",e=>{
  startX = e.touches[0].clientX;
  startY = e.touches[0].clientY;
})
gameBox.addEventListener("touchmove",e=>{
  if(gameOver) return;
  e.preventDefault();
  let cx = e.touches[0].clientX;
  let cy = e.touches[0].clientY;
  const rect = gameBox.getBoundingClientRect();
  px = cx - rect.left -14;
  py = cy - rect.top -14;
  px = Math.max(0, Math.min(size-28, px));
  py = Math.max(0, Math.min(size-28, py));
  render();
})

function ghostChase(){
  if(gameOver) return;
  for(let g of ghosts){
    if(g.x < px) g.x += g.speed;
    if(g.x > px) g.x -= g.speed;
    if(g.y < py) g.y += g.speed;
    if(g.y > py) g.y -= g.speed;
    g.el.style.left = g.x+"px";
    g.el.style.top = g.y+"px";
  }
  checkCollision();
  chaseTimer = setTimeout(ghostChase,60);
}

function checkCollision(){
  for(let g of ghosts){
    const dist = Math.hypot(px-g.x, py-g.y);
    if(dist < 26){
      if(hasWeapon){
        //击杀闪光特效
        g.el.classList.add("killFlash");
        setTimeout(()=>{g.el.remove()},200);
        ghosts = ghosts.filter(x=>x!==g);
        score += 15;
        scoreDom.innerText = score;
        hasWeapon = false;
      }else{
        gameOver = true;
        finalScoreDom.innerText = score;
        overPanel.style.display = "flex";
        return;
      }
    }
  }
  // 捡星星，+10分
  const distStar = Math.hypot(px-sx, py-sy);
  if(distStar < 24){
    score += 10;
    scoreDom.innerText = score;
    newStar();
    render();
  }
  // 拾取武器
  if(!hasWeapon && weaponDom.style.display !== "none"){
    const distW = Math.hypot(px-weaponX, py-weaponY);
    if(distW < 26){
      hasWeapon = true;
      weaponDom.style.display = "none";
    }
  }
}

// 每5秒刷一把武器
function spawnWeapon(){
  if(gameOver) return;
  if(!hasWeapon){
    weaponX = Math.random()*(size-24);
    weaponY = Math.random()*(size-24);
    weaponDom.style.display = "block";
    render();
  }
  weaponTimer = setTimeout(spawnWeapon,5000);
}

// 每6秒召唤新蛆
function spawnGhostTimer(){
  if(gameOver) return;
  addGhost();
  ghostTimer = setTimeout(spawnGhostTimer,6000);
}

restartBtn.onclick = ()=>{
  clearTimeout(weaponTimer);
  clearTimeout(ghostTimer);
  clearTimeout(chaseTimer);

  ghosts.forEach(g=>g.el.remove());
  ghosts = [];
  score = 0;
  scoreDom.innerText = 0;
  gameOver = false;
  hasWeapon = false;
  ghostCount = 0;
  overPanel.style.display = "none";
  px = 150; py = 150;
  newStar();
  weaponDom.style.display = "none";
  render();

  addGhost();
  ghostChase();
  spawnWeapon();
  spawnGhostTimer();
}

render();
addGhost();
ghostChase();
spawnWeapon();
spawnGhostTimer();
</script>
</body>
</html>
